<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyric Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="card">
    <header class="header">
      <div class="vinyl" aria-hidden="true"></div>
      <div class="heading">
        <p class="eyebrow">Now showing</p>
        <h1 id="title">Lyrics</h1>
      </div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </header>

    <section class="stage" id="stage" aria-live="polite">
      <div class="slot">
        <span class="num"></span>
        <p class="text">Loading lyrics…</p>
      </div>
    </section>
    <p class="up-next" id="up-next"></p>

    <div class="progress">
      <div class="bar" id="bar" role="progressbar" aria-valuemin="1"><div id="bar-fill"></div></div>
      <div class="progress-meta">
        <span id="progress-text"></span>
        <span id="percent"></span>
      </div>
    </div>

    <div class="controls">
      <button id="prev" aria-label="Previous line">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg><span class="label">Previous</span>
      </button>
      <button id="play"></button>
      <button id="next" aria-label="Next line">
        <span class="label">Next</span><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    <p class="hint"><kbd>←</kbd> <kbd>→</kbd> navigate · <kbd>Space</kbd> play / pause · click the bar to jump</p>

    <div id="loader">
      <p>Couldn't load <code id="filename"></code>. Choose a lyrics file instead:</p>
      <input type="file" id="file" accept=".txt,text/plain">
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
